                <p>飞天山梦里故乡农庄位于湖南郴州苏仙区飞天山西大门老虎码头风景区，依着飞天山丹霞峰林与翠江风光而居，距离飞天山景区地标约780米。</p>
                <p>农庄提供单人间、双人间和三人间等住宿选择，并设有餐厅、茶室、棋牌室等休闲空间。这里保留着乡村住处的朴实与亲切，适合景区游览、家庭出行、朋友相聚和周末短住。</p>
